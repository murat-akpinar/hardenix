meta:
  distro: almalinux
  version: "9"
  pretty_name: AlmaLinux 9
  arch_fallback: false

packages:
  manager: dnf
  oscap: openscap-utils
  ssg: scap-security-guide

scap:
  xml_path: /usr/share/xml/scap/ssg/content/ssg-almalinux9-ds.xml
  profiles:
    production:  xccdf_org.ssgproject.content_profile_cis_server_l1
    staging:     xccdf_org.ssgproject.content_profile_cis_server_l1
    development: xccdf_org.ssgproject.content_profile_standard

backup:
  config_dirs:
    - /etc/ssh
    - /etc/sysctl.conf
    - /etc/sysctl.d
    - /etc/security
    - /etc/pam.d
    - /etc/audit
    - /etc/login.defs
    - /etc/sudoers.d
    - /etc/modprobe.d
    - /etc/cron.d
    - /etc/profile.d
    - /etc/selinux

exclusions:
  rules:    []
  services: []
  paths:    []
  users:    []

hooks:
  pre_hardening:  ""
  post_hardening: ""
  on_rollback:    ""
