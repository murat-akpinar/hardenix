meta:
  distro: ubuntu
  version: "24.04"
  pretty_name: Ubuntu 24.04 LTS
  arch_fallback: false

packages:
  manager: apt-get
  oscap: openscap-utils
  ssg: ssg-base ssg-debderived

scap:
  xml_path: /usr/share/xml/scap/ssg/content/ssg-ubuntu2404-ds.xml
  profiles:
    production:  xccdf_org.ssgproject.content_profile_cis_level2_server  # --level 2
    development: xccdf_org.ssgproject.content_profile_cis_level1_server  # --level 1

backup:
  # CIS remediation'ın dokunduğu tüm config konumları — unapply'ın tam geri
  # alabilmesi için. Var olmayan yollar yedeklemede otomatik atlanır.
  config_dirs:
    - /etc/ssh
    - /etc/sysctl.conf
    - /etc/sysctl.d
    - /etc/security
    - /etc/pam.d
    - /etc/audit
    - /etc/login.defs
    - /etc/sudoers
    - /etc/sudoers.d
    - /etc/modprobe.d
    - /etc/profile.d
    - /etc/apparmor.d
    # Logging
    - /etc/rsyslog.conf
    - /etc/rsyslog.d
    - /etc/logrotate.conf
    - /etc/logrotate.d
    # systemd (coredump, journald, timesyncd, resolved drop-in'leri)
    - /etc/systemd
    # Boot/kernel & servis varsayılanları (grub cmdline vb.)
    - /etc/default
    # Yasal uyarı banner'ları
    - /etc/issue
    - /etc/issue.net
    - /etc/motd
    # Zaman senkronu
    - /etc/chrony
    - /etc/chrony.conf
    # cron / at erişim kontrolü ve zamanlanmış işler
    - /etc/crontab
    - /etc/cron.d
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
    - /etc/cron.allow
    - /etc/cron.deny
    - /etc/at.allow
    - /etc/at.deny
    # TCP wrappers
    - /etc/hosts.allow
    - /etc/hosts.deny
    # Mount seçenekleri (nodev/nosuid/noexec)
    - /etc/fstab

exclusions:
  rules:
    # Firewall kuralları — varsayılan DROP policy SSH bağlantısını kesebilir
    - xccdf_org.ssgproject.content_rule_set_ufw_default_rule
    - xccdf_org.ssgproject.content_rule_set_iptables_default_rule
    - xccdf_org.ssgproject.content_rule_ip6tables_rules_for_open_ports
    - xccdf_org.ssgproject.content_rule_nftables_rules_permanent
    - xccdf_org.ssgproject.content_rule_set_nftables_table
    # NFS sunucusu çalışıyorsa aşağıdaki satırları uncomment edin:
    # - xccdf_org.ssgproject.content_rule_package_autofs_removed
    # - xccdf_org.ssgproject.content_rule_service_autofs_disabled
    # - xccdf_org.ssgproject.content_rule_package_nfs-kernel-server_removed
    # - xccdf_org.ssgproject.content_rule_package_rpcbind_removed
    # - xccdf_org.ssgproject.content_rule_service_rpcbind_disabled
    # - xccdf_org.ssgproject.content_rule_service_nfs_disabled
    # - xccdf_org.ssgproject.content_rule_service_smb_disabled
  services: []
  paths:    []

hooks:
  pre_hardening:  ""
  post_hardening: ""
  on_rollback:    ""
