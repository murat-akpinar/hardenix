meta:
  distro: debian
  version: "12"
  pretty_name: Debian 12 (Bookworm)
  arch_fallback: false

packages:
  manager: apt-get
  oscap: openscap-utils
  ssg: ssg-base ssg-debian
  lynis: lynis

scap:
  xml_path: /usr/share/xml/scap/ssg/content/ssg-debian12-ds.xml
  # Debian Security OVAL feed (bookworm) for --scan-cve — note the .xml.bz2
  # filename (the bare .xml path returns 403).
  oval_url: https://www.debian.org/security/oval/oval-definitions-bookworm.xml.bz2
  # SSG publishes no CIS profile for Debian; ANSSI BP28 is the strictest option.
  profiles:
    production:  xccdf_org.ssgproject.content_profile_anssi_bp28_enhanced  # --level 2
    development: xccdf_org.ssgproject.content_profile_standard             # --level 1

backup:
  config_dirs:
    - /etc/ssh
    - /etc/sysctl.conf
    - /etc/sysctl.d
    - /etc/security
    - /etc/pam.d
    - /etc/audit
    - /etc/login.defs
    - /etc/sudoers.d
    - /etc/modprobe.d
    - /etc/cron.d
    - /etc/profile.d
    # Extended 2026-08-15: measured on a VM, CIS remediation wrote 58
    # files outside the old list, so --unapply could not revert them.
    - /etc/sudoers
    - /etc/profile
    - /etc/issue
    - /etc/issue.net
    - /etc/motd
    - /etc/fstab
    - /etc/crontab
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
    - /etc/cron.allow
    - /etc/cron.deny
    - /etc/at.allow
    - /etc/at.deny
    - /etc/hosts.allow
    - /etc/hosts.deny
    - /etc/systemd
    - /etc/default
    - /etc/rsyslog.conf
    - /etc/rsyslog.d
    - /etc/logrotate.conf
    - /etc/logrotate.d
    - /etc/aide.conf
    - /etc/bash.bashrc
    - /etc/chrony
    - /etc/chrony.conf
    - /etc/ufw

exclusions:
  rules:
    # NOTE: Debian uses the ANSSI profile; the CIS firewall rule IDs are not
    # valid here. Firewall hardening can cut SSH access — always verify your
    # connection after applying.
    # If NFS/SMB is running the script asks at runtime; to force it, uncomment below:
    # - xccdf_org.ssgproject.content_rule_package_autofs_removed
    # - xccdf_org.ssgproject.content_rule_service_autofs_disabled
    # - xccdf_org.ssgproject.content_rule_package_nfs-kernel-server_removed
    # - xccdf_org.ssgproject.content_rule_package_rpcbind_removed
    # - xccdf_org.ssgproject.content_rule_service_rpcbind_disabled
    # - xccdf_org.ssgproject.content_rule_service_nfs_disabled
    # - xccdf_org.ssgproject.content_rule_service_smb_disabled
  services: []
  paths:    []

hooks:
  pre_hardening:  ""
  post_hardening: ""
  on_rollback:    ""
