meta:
  distro: arch
  version: rolling
  pretty_name: Arch Linux
  arch_fallback: true

packages:
  manager: pacman
  oscap: openscap
  ssg: ""
  lynis: lynis

scap:
  xml_path: ""
  profiles:
    production:  ""  # --level 2
    development: ""  # --level 1

backup:
  config_dirs:
    - /etc/ssh
    - /etc/sysctl.conf
    - /etc/sysctl.d
    - /etc/security
    - /etc/pam.d
    - /etc/audit
    - /etc/login.defs
    - /etc/sudoers.d
    - /etc/modprobe.d
    - /etc/cron.d
    - /etc/profile.d
    # Extended 2026-08-15: measured on a VM, CIS remediation wrote 58
    # files outside the old list, so --unapply could not revert them.
    - /etc/sudoers
    - /etc/profile
    - /etc/issue
    - /etc/issue.net
    - /etc/motd
    - /etc/fstab
    - /etc/crontab
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
    - /etc/cron.allow
    - /etc/cron.deny
    - /etc/at.allow
    - /etc/at.deny
    - /etc/hosts.allow
    - /etc/hosts.deny
    - /etc/systemd
    - /etc/default
    - /etc/rsyslog.conf
    - /etc/rsyslog.d
    - /etc/logrotate.conf
    - /etc/logrotate.d
    - /etc/aide.conf
    - /etc/bash.bashrc

exclusions:
  rules:    []
  services: []
  paths:    []

hooks:
  pre_hardening:  ""
  post_hardening: ""
  on_rollback:    ""
