meta:
  distro: rocky
  version: "9"
  pretty_name: Rocky Linux 9
  arch_fallback: false

packages:
  manager: dnf
  oscap: openscap-utils
  ssg: scap-security-guide
  lynis: lynis   # EPEL'de — eksikse önce: dnf install -y epel-release

scap:
  xml_path: /usr/share/xml/scap/ssg/content/ssg-rl9-ds.xml
  profiles:
    production:  xccdf_org.ssgproject.content_profile_cis           # --level 2 (CIS L2 Server)
    development: xccdf_org.ssgproject.content_profile_cis_server_l1  # --level 1 (CIS L1 Server)

backup:
  config_dirs:
    - /etc/ssh
    - /etc/sysctl.conf
    - /etc/sysctl.d
    - /etc/security
    - /etc/pam.d
    - /etc/audit
    - /etc/login.defs
    - /etc/sudoers.d
    - /etc/modprobe.d
    - /etc/cron.d
    - /etc/profile.d
    - /etc/selinux/config   # config only — never raw-restore the policy store

exclusions:
  rules:
    # NFS sunucusu çalışıyorsa aşağıdaki satırları uncomment edin:
    # - xccdf_org.ssgproject.content_rule_package_autofs_removed
    # - xccdf_org.ssgproject.content_rule_service_autofs_disabled
    # - xccdf_org.ssgproject.content_rule_package_nfs-utils_removed
    # - xccdf_org.ssgproject.content_rule_package_rpcbind_removed
    # - xccdf_org.ssgproject.content_rule_service_rpcbind_disabled
    # - xccdf_org.ssgproject.content_rule_service_nfs_disabled
    # - xccdf_org.ssgproject.content_rule_service_smb_disabled
  services: []
  paths:    []

hooks:
  pre_hardening:  ""
  post_hardening: ""
  on_rollback:    ""
