meta:
  distro: fedora
  version: "40"
  pretty_name: Fedora Linux 40
  arch_fallback: false

packages:
  manager: dnf
  oscap: openscap-utils
  ssg: scap-security-guide
  lynis: lynis

scap:
  xml_path: /usr/share/xml/scap/ssg/content/ssg-fedora-ds.xml
  # SSG publishes no CIS profile for Fedora; OSPP is the most complete profile.
  profiles:
    production:  xccdf_org.ssgproject.content_profile_ospp      # --level 2
    development: xccdf_org.ssgproject.content_profile_standard  # --level 1

backup:
  config_dirs:
    - /etc/ssh
    - /etc/sysctl.conf
    - /etc/sysctl.d
    - /etc/security
    - /etc/pam.d
    - /etc/audit
    - /etc/login.defs
    - /etc/sudoers.d
    - /etc/modprobe.d
    - /etc/cron.d
    - /etc/profile.d
    - /etc/selinux

exclusions:
  rules:
    # If an NFS server is running, uncomment the lines below:
    # - xccdf_org.ssgproject.content_rule_package_autofs_removed
    # - xccdf_org.ssgproject.content_rule_service_autofs_disabled
    # - xccdf_org.ssgproject.content_rule_package_nfs-utils_removed
    # - xccdf_org.ssgproject.content_rule_package_rpcbind_removed
    # - xccdf_org.ssgproject.content_rule_service_rpcbind_disabled
    # - xccdf_org.ssgproject.content_rule_service_nfs_disabled
    # - xccdf_org.ssgproject.content_rule_service_smb_disabled
  services: []
  paths:    []

hooks:
  pre_hardening:  ""
  post_hardening: ""
  on_rollback:    ""
