meta:
  distro: ubuntu
  version: "22.04"
  pretty_name: Ubuntu 22.04 LTS
  arch_fallback: false

packages:
  manager: apt-get
  oscap: openscap-utils
  ssg: ssg-base ssg-debderived

scap:
  xml_path: /usr/share/xml/scap/ssg/content/ssg-ubuntu2204-ds.xml
  profiles:
    production:  xccdf_org.ssgproject.content_profile_cis_level2_server
    staging:     xccdf_org.ssgproject.content_profile_cis_level2_server
    development: xccdf_org.ssgproject.content_profile_cis_level1_server

backup:
  config_dirs:
    - /etc/ssh
    - /etc/sysctl.conf
    - /etc/sysctl.d
    - /etc/security
    - /etc/pam.d
    - /etc/audit
    - /etc/login.defs
    - /etc/sudoers.d
    - /etc/modprobe.d
    - /etc/cron.d
    - /etc/profile.d
    - /etc/apparmor.d

exclusions:
  rules:
    # Firewall kuralları — varsayılan DROP policy SSH bağlantısını kesebilir
    - xccdf_org.ssgproject.content_rule_set_ufw_default_rule
    - xccdf_org.ssgproject.content_rule_set_iptables_default_rule
    - xccdf_org.ssgproject.content_rule_ip6tables_rules_for_open_ports
    - xccdf_org.ssgproject.content_rule_nftables_rules_permanent
    - xccdf_org.ssgproject.content_rule_set_nftables_table
    # NFS sunucusu çalışıyorsa aşağıdaki satırları uncomment edin:
    # - xccdf_org.ssgproject.content_rule_package_autofs_removed
    # - xccdf_org.ssgproject.content_rule_service_autofs_disabled
    # - xccdf_org.ssgproject.content_rule_package_nfs-kernel-server_removed
    # - xccdf_org.ssgproject.content_rule_package_rpcbind_removed
    # - xccdf_org.ssgproject.content_rule_service_rpcbind_disabled
    # - xccdf_org.ssgproject.content_rule_service_nfs_disabled
    # - xccdf_org.ssgproject.content_rule_service_smb_disabled
  services: []
  paths:    []

hooks:
  pre_hardening:  ""
  post_hardening: ""
  on_rollback:    ""
