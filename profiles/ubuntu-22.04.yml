meta:
  distro: ubuntu
  version: "22.04"
  pretty_name: Ubuntu 22.04 LTS
  arch_fallback: false

packages:
  manager: apt-get
  oscap: openscap-utils
  ssg: ssg-base ssg-debderived
  lynis: lynis

scap:
  xml_path: /usr/share/xml/scap/ssg/content/ssg-ubuntu2204-ds.xml
  # Canonical USN OVAL feed (22.04 = jammy) for --scan-cve
  oval_url: https://security-metadata.canonical.com/oval/com.ubuntu.jammy.usn.oval.xml.bz2
  profiles:
    production:  xccdf_org.ssgproject.content_profile_cis_level2_server  # --level 2
    development: xccdf_org.ssgproject.content_profile_cis_level1_server  # --level 1

backup:
  config_dirs:
    - /etc/ssh
    - /etc/sysctl.conf
    - /etc/sysctl.d
    - /etc/security
    - /etc/pam.d
    - /etc/audit
    - /etc/login.defs
    - /etc/sudoers.d
    - /etc/modprobe.d
    - /etc/cron.d
    - /etc/profile.d
    - /etc/apparmor.d
    # Extended 2026-08-15: measured on a VM, CIS remediation wrote 58
    # files outside the old list, so --unapply could not revert them.
    - /etc/sudoers
    - /etc/profile
    - /etc/issue
    - /etc/issue.net
    - /etc/motd
    - /etc/fstab
    - /etc/crontab
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
    - /etc/cron.allow
    - /etc/cron.deny
    - /etc/at.allow
    - /etc/at.deny
    - /etc/hosts.allow
    - /etc/hosts.deny
    - /etc/systemd
    - /etc/default
    - /etc/rsyslog.conf
    - /etc/rsyslog.d
    - /etc/logrotate.conf
    - /etc/logrotate.d
    - /etc/aide.conf
    - /etc/bash.bashrc
    - /etc/chrony
    - /etc/chrony.conf
    - /etc/ufw

exclusions:
  rules:
    # Firewall rules — a default DROP policy can cut the SSH connection
    - xccdf_org.ssgproject.content_rule_set_ufw_default_rule
    - xccdf_org.ssgproject.content_rule_set_iptables_default_rule
    - xccdf_org.ssgproject.content_rule_ip6tables_rules_for_open_ports
    - xccdf_org.ssgproject.content_rule_nftables_rules_permanent
    - xccdf_org.ssgproject.content_rule_set_nftables_table
    # If an NFS server is running, uncomment the lines below:
    # - xccdf_org.ssgproject.content_rule_package_autofs_removed
    # - xccdf_org.ssgproject.content_rule_service_autofs_disabled
    # - xccdf_org.ssgproject.content_rule_package_nfs-kernel-server_removed
    # - xccdf_org.ssgproject.content_rule_package_rpcbind_removed
    # - xccdf_org.ssgproject.content_rule_service_rpcbind_disabled
    # - xccdf_org.ssgproject.content_rule_service_nfs_disabled
    # - xccdf_org.ssgproject.content_rule_service_smb_disabled
  services: []
  paths:    []

hooks:
  pre_hardening:  ""
  post_hardening: ""
  on_rollback:    ""
