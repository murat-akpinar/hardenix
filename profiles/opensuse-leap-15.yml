meta:
  distro: opensuse-leap
  version: "15"
  pretty_name: openSUSE Leap 15
  arch_fallback: false

packages:
  manager: zypper
  oscap: openscap
  ssg: scap-security-guide

scap:
  xml_path: /usr/share/xml/scap/ssg/content/ssg-sle15-ds.xml  # SSG has no separate Leap datastream; SLE 15 profile is used
  # SUSE OVAL feed for --scan-cve. Pin to your Leap minor (15.5 / 15.6 / …).
  oval_url: https://ftp.suse.com/pub/projects/security/oval/opensuse.leap.15.6.xml.gz
  profiles:
    production:  xccdf_org.ssgproject.content_profile_cis_server_l2  # --level 2
    development: xccdf_org.ssgproject.content_profile_cis_server_l1  # --level 1

backup:
  config_dirs:
    - /etc/ssh
    - /etc/sysctl.conf
    - /etc/sysctl.d
    - /etc/security
    - /etc/pam.d
    - /etc/audit
    - /etc/login.defs
    - /etc/sudoers.d
    - /etc/modprobe.d
    - /etc/cron.d
    - /etc/profile.d
    - /etc/apparmor.d

exclusions:
  rules:
    # NFS sunucusu çalışıyorsa aşağıdaki satırları uncomment edin:
    # - xccdf_org.ssgproject.content_rule_package_autofs_removed
    # - xccdf_org.ssgproject.content_rule_service_autofs_disabled
    # - xccdf_org.ssgproject.content_rule_package_nfs-utils_removed
    # - xccdf_org.ssgproject.content_rule_package_rpcbind_removed
    # - xccdf_org.ssgproject.content_rule_service_rpcbind_disabled
    # - xccdf_org.ssgproject.content_rule_service_nfs_disabled
    # - xccdf_org.ssgproject.content_rule_service_smb_disabled
  services: []
  paths:    []

hooks:
  pre_hardening:  ""
  post_hardening: ""
  on_rollback:    ""
